shahed-attack-ballistic-defense=Позволяет сопровождать и перехватывать баллистические ракеты и, при настройке, шахеды.
shahed-attack-rail-air-defense=Зенитная установка на вагоне для сопровождения поездов.
shahed-attack-rail-missile-defense=Пусковая ПРО на вагоне.

