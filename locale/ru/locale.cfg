shahed-attack-abm-wagon=Вагон ПРО

[entity-description]
shahed-attack-recon-drone=Собирает данные для следующих налётов, если достаточно долго остаётся над заводом.
shahed-attack-strike-drone=Летающий сквозь препятствия дрон-камикадзе, нацеленный на производство и поезда.
shahed-attack-heavy-drone=Более медленный бронированный аппарат с увеличенной боевой частью.
shahed-attack-decoy-drone=Дешёвая имитация ударного дрона. Отвлекает огонь от настоящей атаки.
shahed-attack-airfield=Каждый налёт дронов начинается с аэродрома. Уничтожьте его, чтобы прекратить налёты с него.
shahed-attack-ballistic-site=Каждая баллистическая ракета стартует с пусковой. Уничтожьте её, чтобы прекратить пуски с неё.
shahed-attack-early-warning-radar=Обнаруживает дроны в радиусе 384 клеток, баллистику — 2048. Поднимает тревогу, когда до прибытия остаётся до 60 секунд. Требует питания.
shahed-attack-aa-turret=Дальнобойная турель, атакующая только воздушные цели.
shahed-attack-abm-battery=ПРО с радиусом 192 клетки. Держит 4 готовых контейнера и перезаряжает по одному раз в 10 секунд из запаса. Пуск расходует одну противоракету и 10 МДж. Типы целей выбираются в окне батареи.
shahed-attack-aa-wagon=Вагон с зенитной установкой. Радиус 30. Берёт зенитные магазины из своего грузового отсека.
shahed-attack-abm-wagon=Вагон с пусковой ПРО. Радиус 128, питание не нужно. Держит 4 готовых контейнера и берёт противоракеты из грузового отсека.

