shahed-attack-show-radar-ranges=Показывать радиусы радаров на карте

[mod-setting-description]
shahed-attack-raid-size-multiplier=Масштабирует число аппаратов в налёте. С ростом эволюции налёты растут от небольших групп до массированных.
shahed-attack-max-raid-size=Верхний предел аппаратов в одном налёте, включая ловушки и ударные по ПВО.
shahed-attack-grace-period-days=Налётов нет, пока с момента добавления мода не пройдёт столько игровых дней.
shahed-attack-damage-multiplier=Масштабирует боевые части ударных, тяжёлых дронов и ловушек.
shahed-attack-decoys-enabled=С эволюции 0,3 часть налёта — дешёвые ловушки. На радаре они неотличимы от ударных и отвлекают огонь, но не несут настоящей боевой части.
shahed-attack-defense-suppression-enabled=С эволюции 0,5 часть ударных аппаратов атакует зенитки, радары и пусковые ПРО рядом с основной целью.
shahed-attack-adaptive-raids-enabled=После успешной разведки (или с эволюции 0,7) в налёт добавляются аппараты за каждую известную зенитку и пусковую ПРО, работающую по дронам, возле цели.
shahed-attack-max-active-drones=Ограничение для производительности. Новые аппараты не взлетают, пока в воздухе столько дронов.
shahed-attack-ballistic-start-day=Для баллистики нужны этот игровой день, стартовая эволюция и время подготовки после химической науки.
shahed-attack-ballistic-start-evolution=Эволюция начала баллистики. Класс ракет, точность, размер залпа и частота растут от этой точки до полной эволюции.
shahed-attack-ballistic-preparation-minutes=Время на постройку первой ПРО после исследования химической науки.
shahed-attack-max-ballistic-salvo=Число ракет в самом большом залпе при полной эволюции.
shahed-attack-flak-accuracy=Шанс попадания специализированного зенитного снаряда. Промахи всё равно расходуют боеприпасы.
shahed-attack-intercept-accuracy=Базовая вероятность попадания одной противоракеты. По лёгким ракетам попасть проще, по тяжёлым — сложнее, по дронам — проще.
shahed-attack-interceptors-per-target=Доктрина огня: пусковые не стреляют по цели, пока к ней летит столько противоракет, и стреляют снова после промаха.
shahed-attack-alert-delivery=Выберите глобальный звук, сигналы схемы или оба способа предупреждения.

[string-mod-setting]
shahed-attack-alert-delivery-both=Глобальный звук и сигналы схемы
shahed-attack-alert-delivery-global-sound=Только глобальный звук
shahed-attack-alert-delivery-circuit-only=Только сигналы схемы

