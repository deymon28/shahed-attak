[technology-name]
shahed-attack-air-defense=Противовоздушная оборона
shahed-attack-ballistic-defense=Противоракетная оборона

[technology-description]
shahed-attack-air-defense=Позволяет обнаруживать и эффективно уничтожать новую воздушную фракцию врага.
shahed-attack-ballistic-defense=Позволяет сопровождать и пытаться перехватывать редкие стратегические ракеты.

[virtual-signal-name]
shahed-attack-air-raid-signal=Обнаруженные воздушные цели
shahed-attack-ballistic-signal=Обнаруженные баллистические цели

[shahed-attack-message]
air-raid=Воздушная тревога: __1__ целей с направления __2__. До прибытия около __3__ сек.
recon-complete=Вражеская разведка завершена. Следующие две атаки станут точнее.
ballistic-warning=Баллистическая ракета с направления __2__. До удара около __1__ сек.
intercept-success=Противоракета попала. Вероятность этой попытки составляла __1__%.
intercept-failed=Противоракета промахнулась. Вероятность этой попытки составляла __1__%.
admin-only=Эта команда доступна только администраторам.
no-target=На этой поверхности не найдена подходящая цель игрока.
unknown-command=Неизвестная подкоманда: __1__.
event-created=Событие воздушной войны __1__ создано.
event-failed=Не удалось создать событие: __1__.
command-help=Использование: /shahed-attack <status|recon|raid|heavy-raid|ballistic>

