[mod-name]
shahed-attack=Shahed Attack: Air War

[mod-description]
shahed-attack=Воздушная вражеская фракция с разведкой, налётами шахедов, редкими ночными баллистическими ударами и эшелонированной ПВО.

[mod-setting-name]
shahed-attack-intercept-accuracy=Точность противоракет
shahed-attack-raid-frequency-multiplier=Множитель частоты налётов
shahed-attack-raid-size-multiplier=Множитель размера налётов
shahed-attack-damage-multiplier=Множитель урона воздушных атак
shahed-attack-flak-accuracy=Точность зенитной турели
shahed-attack-ballistic-enabled=Включить баллистические удары
shahed-attack-ballistic-frequency-multiplier=Множитель частоты баллистики
shahed-attack-external-share=Доля внешних атак
shahed-attack-recon-enabled=Включить разведывательные миссии
shahed-attack-alert-delivery=Способ передачи тревоги
shahed-attack-alert-sound=Включить звуки тревоги
shahed-attack-verbose-alerts=Показывать подробные воздушные тревоги

[mod-setting-description]
shahed-attack-intercept-accuracy=Независимая вероятность попадания каждой противоракеты при сближении. Готовые батареи запускают ракеты раз в секунду в радиусе 192 клеток.
shahed-attack-external-share=Доля атак, которые могут прийти извне известных вражеских баз.
shahed-attack-flak-accuracy=Шанс попадания специализированного зенитного снаряда. Промахи всё равно расходуют боеприпасы.
shahed-attack-alert-delivery=Выберите глобальный звук, сигналы схемы или оба способа предупреждения.

[string-mod-setting]
shahed-attack-alert-delivery-both=Глобальный звук и сигналы схемы
shahed-attack-alert-delivery-global-sound=Только глобальный звук
shahed-attack-alert-delivery-circuit-only=Только сигналы схемы

[entity-name]
shahed-attack-recon-drone=Разведывательный дрон
shahed-attack-strike-drone=Ударный шахед
shahed-attack-heavy-drone=Тяжёлый ударный шахед
shahed-attack-airfield=Вражеский аэродром дронов
shahed-attack-ballistic-site=Вражеская баллистическая пусковая
shahed-attack-early-warning-radar=Радар раннего предупреждения
shahed-attack-aa-turret=Зенитная турель
shahed-attack-abm-battery=Батарея ПРО

[entity-description]
shahed-attack-recon-drone=Собирает данные для следующих налётов, если достаточно долго остаётся над заводом.
shahed-attack-strike-drone=Летающий сквозь препятствия дрон-камикадзе, нацеленный на производство.
shahed-attack-heavy-drone=Более медленный бронированный аппарат с увеличенной боевой частью.
shahed-attack-airfield=Уничтожьте его, чтобы сократить число местных налётов.
shahed-attack-ballistic-site=Уничтожьте её, чтобы значительно уменьшить вероятность баллистических запусков.
shahed-attack-early-warning-radar=Обнаруживает дроны в радиусе 384 клеток, баллистику — 2048. Поднимает тревогу, когда до прибытия остаётся до 60 секунд. Требует питания.
shahed-attack-aa-turret=Дальнобойная турель, атакующая только воздушные цели.
shahed-attack-abm-battery=Автономная ПРО с радиусом 192 клетки. Запускает противоракеты раз в секунду, пока баллистическая цель не уничтожена. Пуск расходует одну противоракету и 10 МДж. Вероятность попадания по умолчанию — 70%. Типы целей выбираются в окне батареи; по умолчанию — только баллистика.

[item-name]
shahed-attack-early-warning-radar=Радар раннего предупреждения
shahed-attack-aa-turret=Зенитная турель
shahed-attack-abm-battery=Батарея ПРО
shahed-attack-flak-magazine=Зенитный магазин
shahed-attack-interceptor=Противоракета

