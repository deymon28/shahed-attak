[mod-name]
shahed-attack=Shahed Attack: Air War

[mod-description]
shahed-attack=Воздушная вражеская фракция: разведка, массированные налёты шахедов с ложными целями, растущие баллистические залпы и эшелонированная ПВО, включая вагоны ПВО и ПРО.

