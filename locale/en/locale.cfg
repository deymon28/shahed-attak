[entity-description]
shahed-attack-recon-drone=Collects targeting data for later raids if it remains over the factory long enough.
shahed-attack-strike-drone=Collisionless kamikaze aircraft that targets production buildings and trains.
shahed-attack-heavy-drone=Slower armored aircraft carrying a larger warhead.
shahed-attack-decoy-drone=Cheap imitation of a strike drone. Draws fire away from the real attack.
shahed-attack-airfield=Every drone raid starts at an airfield. Destroy it to stop raids from it.
shahed-attack-ballistic-site=Every ballistic missile starts at a launch site. Destroy it to stop launches from it.
shahed-attack-early-warning-radar=Detects drones within 384 tiles and ballistics within 2048. Warns when estimated arrival is within 60 seconds. Requires power.
shahed-attack-aa-turret=Long-range turret that only attacks aerial targets.
shahed-attack-abm-battery=Missile defense with a 192-tile radius. Holds 4 ready canisters and reloads one every 10 seconds from its ammunition. Each launch uses one interceptor and 10 MJ. Choose target types in the battery window.
shahed-attack-aa-wagon=Rail car with an anti-air gun mount. Range 30. Loads flak magazines from its cargo slots.
shahed-attack-abm-wagon=Rail car with a missile launcher. Range 128, no power needed. Holds 4 ready canisters and loads interceptors from its cargo slots.

