[mod-setting-description]
shahed-attack-raid-size-multiplier=Scales the number of aircraft per raid. Raids grow from small groups to mass raids as enemy evolution rises.
shahed-attack-max-raid-size=Upper limit of aircraft in one raid, including decoys and defense-suppression aircraft.
shahed-attack-grace-period-days=No drone raids before this many game days have passed since the mod was added.
shahed-attack-damage-multiplier=Scales strike, heavy and decoy drone warheads.
shahed-attack-decoys-enabled=From evolution 0.3 part of each raid is cheap decoys. They look like strike drones on radar and draw fire, but carry no real warhead.
shahed-attack-defense-suppression-enabled=From evolution 0.5 part of the strike aircraft target AA guns, radars and missile-defense launchers near the main target.
shahed-attack-adaptive-raids-enabled=After successful reconnaissance (or from evolution 0.7) raids add aircraft for every known AA gun and drone-engaging missile launcher near the target.
shahed-attack-max-active-drones=Performance limit. New aircraft are not launched while this many are in the air.
shahed-attack-ballistic-start-day=Ballistic strikes need this game day, the start evolution and the preparation time after chemical science.
shahed-attack-ballistic-start-evolution=Evolution at which ballistic strikes begin. Missile class, accuracy, salvo size and frequency grow from here to full evolution.
shahed-attack-ballistic-preparation-minutes=Time to build the first missile defense after chemical science is researched.
shahed-attack-max-ballistic-salvo=Missiles in the largest salvo at full evolution.
shahed-attack-flak-accuracy=Chance that a specialized anti-aircraft shell hits its target. Misses still consume ammunition.
shahed-attack-intercept-accuracy=Base hit probability of one interceptor. Light missiles are easier and heavy missiles harder to hit; drones are easier.
shahed-attack-interceptors-per-target=Fire doctrine: launchers stop firing at a target while this many interceptors fly toward it, and fire again after a miss.
shahed-attack-alert-delivery=Choose whether warnings use global sound, circuit signals, or both.

[string-mod-setting]
shahed-attack-alert-delivery-both=Global sound and circuit signals
shahed-attack-alert-delivery-global-sound=Global sound only
shahed-attack-alert-delivery-circuit-only=Circuit signals only

