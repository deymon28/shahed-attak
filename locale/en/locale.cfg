shahed-attack-air-defense=Air defense
shahed-attack-ballistic-defense=Ballistic missile defense

[technology-description]
shahed-attack-air-defense=Detect and efficiently destroy the new aerial enemy faction.
shahed-attack-ballistic-defense=Track and attempt to intercept rare strategic missiles.

[virtual-signal-name]
