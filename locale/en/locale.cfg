[mod-name]
shahed-attack=Shahed Attack: Air War

[mod-description]
shahed-attack=An aerial enemy faction: reconnaissance, mass Shahed raids with decoys, growing ballistic salvos, and layered air defense including rail AA and missile-defense wagons.

