[technology-description]
shahed-attack-air-defense=Detect and destroy the new aerial enemy faction.
shahed-attack-ballistic-defense=Track and intercept ballistic missiles and, if configured, Shahed drones.
shahed-attack-rail-air-defense=An anti-air gun mounted on a rail car to escort trains.
shahed-attack-rail-missile-defense=A missile-defense launcher mounted on a rail car.

