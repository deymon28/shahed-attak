[mod-name]
shahed-attack=Shahed Attack: Air War

[mod-description]
shahed-attack=An aerial enemy faction with reconnaissance, kamikaze raids, rare night ballistic strikes, and layered air defense.

[mod-setting-name]
shahed-attack-intercept-accuracy=Interceptor accuracy
shahed-attack-raid-frequency-multiplier=Raid frequency multiplier
shahed-attack-raid-size-multiplier=Raid size multiplier
shahed-attack-damage-multiplier=Enemy airstrike damage multiplier
shahed-attack-flak-accuracy=Anti-aircraft gun accuracy
shahed-attack-ballistic-enabled=Enable ballistic strikes
shahed-attack-ballistic-frequency-multiplier=Ballistic frequency multiplier
shahed-attack-external-share=External attack share
shahed-attack-recon-enabled=Enable reconnaissance missions
shahed-attack-alert-delivery=Alert delivery
shahed-attack-alert-sound=Enable alert sounds
shahed-attack-verbose-alerts=Show detailed air-raid alerts

[mod-setting-description]
shahed-attack-intercept-accuracy=Independent hit probability per interceptor at encounter. Ready batteries launch every second within 192 tiles.
shahed-attack-external-share=Share of attacks that can arrive from outside known enemy bases.
shahed-attack-flak-accuracy=Chance that a specialized anti-aircraft shell hits its target. Misses still consume ammunition.
shahed-attack-alert-delivery=Choose whether warnings use global sound, circuit signals, or both.

[string-mod-setting]
shahed-attack-alert-delivery-both=Global sound and circuit signals
shahed-attack-alert-delivery-global-sound=Global sound only
shahed-attack-alert-delivery-circuit-only=Circuit signals only

[entity-name]
shahed-attack-recon-drone=Reconnaissance drone
shahed-attack-strike-drone=Strike drone
shahed-attack-heavy-drone=Heavy strike drone
shahed-attack-airfield=Enemy drone airfield
shahed-attack-ballistic-site=Enemy ballistic launch site
shahed-attack-early-warning-radar=Early-warning radar
shahed-attack-aa-turret=Anti-air turret
shahed-attack-abm-battery=Missile-defense battery

[entity-description]
shahed-attack-recon-drone=Collects targeting data for later raids if it remains over the factory long enough.
shahed-attack-strike-drone=Collisionless kamikaze aircraft that targets production buildings.
shahed-attack-heavy-drone=Slower armored aircraft carrying a larger warhead.
shahed-attack-airfield=Destroy it to reduce local drone raids.
shahed-attack-ballistic-site=Destroy it to greatly reduce ballistic launch opportunities.
shahed-attack-early-warning-radar=Detects drones within 384 tiles and ballistics within 2048. Warns when estimated arrival is within 60 seconds. Requires power.
shahed-attack-aa-turret=Long-range turret that only attacks aerial targets.
shahed-attack-abm-battery=Autonomous missile defense with a 192-tile radius. Launches every second while a ballistic target is alive. Each launch uses one interceptor and 10 MJ; default hit probability is 70%. Choose target types in the battery window; ballistic missiles only by default.

[item-name]
shahed-attack-early-warning-radar=Early-warning radar
shahed-attack-aa-turret=Anti-air turret
shahed-attack-abm-battery=Missile-defense battery
shahed-attack-flak-magazine=Flak magazine
shahed-attack-interceptor=Anti-ballistic interceptor

