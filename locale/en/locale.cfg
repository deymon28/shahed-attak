shahed-attack-ballistic-signal=Detected ballistic threats

[shahed-attack-message]
air-raid=Air raid: __1__ targets from __2__. Estimated arrival in __3__ seconds.
recon-complete=Enemy reconnaissance completed. The next two attacks will be more accurate.
ballistic-warning=Ballistic missile from __2__. Estimated impact in __1__ seconds.
intercept-success=Interceptor hit. Single-shot probability was __1__%.
intercept-failed=Interceptor missed. Single-shot probability was __1__%.
admin-only=This command is available to administrators only.
no-target=No valid player target was found on this surface.
unknown-command=Unknown subcommand: __1__.
event-created=Air-war event __1__ created.
event-failed=Could not create event: __1__.
command-help=Usage: /shahed-attack <status|recon|raid|heavy-raid|ballistic>

